<!DOCTYPE html><html><head><title>Investing in Adopt AI - Elevation Capital</title></head><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"data": {"page": {"_createdAt": "2025-05-13T05:18:49Z", "_id": "d9c7a36c-1aa8-4d61-bbdc-1113df93aa00", "_type": "post", "_updatedAt": "2025-05-30T05:08:44Z", "authors": [{"_id": "118993f0-528e-4577-bf1e-571772759f20", "_type": "teamMember", "bio": {"text": [{"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Mukul is a Co-Managing Partner at Elevation and focuses on investments in consumer and SaaS/AI."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Founders are superheroes, and getting to partner with them is a privilege."}], "style": "blockquote"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "\"I believe that the most enduring and valuable companies are built by founders who are really customer-obsessed. Such founders have a much deeper understanding of their market and consumers, and are able to come up with distinctive insights. Therefore, instead of going into meetings with founders with a very strong thesis, my approach is to go in with a completely open mind, try to understand their view of the world, and look for such insights.\n\nThe thing that I love the most about being an early-stage investor, is the opportunity to witness young founders grow exponentially and become phenomenal leaders. It’s really fulfilling to experience the metamorphosis of my relationship with founders – from being someone who advises and mentors them, to being in a place where I get to learn so much from them. Getting to partner with such superheroes is really inspiring and energizing, and also enables me to be on a continuous learning journey.\""}], "style": "normal"}]}, "cursorText": "Founders are superheroes, and getting to partner with them is a privilege.", "expertise": [{"_id": "731aa1b1-8dbb-40bb-9596-44d34a62063b", "title": "Consumer Tech"}, {"_id": "a2de2a93-05f7-49a1-a884-a95a5376852a", "title": "Consumer Brands"}, {"_id": "76783816-50b8-4bd0-b0ad-08c495102405", "title": "Enterprise AI"}], "isAuthor": true, "page": {"parent": {"_type": "page", "parent": null, "slug": "team", "title": "Team"}, "slug": "mukul-arora"}, "parent": null, "photo": null, "photoTwo": null, "position": "Co-Managing Partner", "slug": null, "socialLinks": [{"_type": "socialLink", "title": "LinkedIn", "url": "https://www.linkedin.com/in/mukularora1/"}, {"_type": "socialLink", "title": "Twitter", "url": "https://twitter.com/mukularora"}], "stage": ["growth", "venture"], "teamMemberType": {"_createdAt": "2024-04-08T23:04:22Z", "_id": "1c80ec0d-3d5f-44f6-8cfe-e2336c1a9495", "_type": "teamMemberType", "_updatedAt": "2024-04-08T23:04:22Z", "priority": 1, "slug": {"_type": "slug", "current": "investment-team"}, "title": "Investment Team"}, "title": "Mukul Arora"}, {"_id": "43a9de36-08aa-467a-8f87-4b1311675631", "_type": "teamMember", "bio": {"text": [{"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Krishna is an AI Partner at Elevation Capital, specializing in Enterprise AI investments. He is based out of the San Francisco Bay Area."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Before joining Elevation, Krishna led engineering for messaging ads at Meta (fka Facebook Inc.), driving $10B+ in revenue with AI-driven products and deploying some of the world’s largest machine-learning models, including early adoption of Meta’s Llama. Prior to Meta, he architected enterprise-grade, exabyte-scale cloud systems at Cohesity."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Krishna is also a successful serial entrepreneur, having co-founded Capillary Technologies in 2008, a forerunner of India's cross-border SaaS movement, which grew to over 300 million consumers and 300 marquee brands across 25,000 locations globally. He later founded Taro in 2015, scaling it to deliver over a million meals before its successful acquisition by EAT Club. As an angel investor, Krishna has backed over 45 companies, which have collectively created over $5 billion in enterprise value."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Krishna graduated from IIT Kharagpur with a B.Tech degree in Computer Science and is the co-author of over ten international papers and patents in software engineering and cloud computing."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "He shares his insights on technology, entrepreneurship, and leadership through his "}, {"_type": "span", "marks": ["7126c3a1a578"], "text": "Day Zero"}, {"_type": "span", "marks": [], "text": " blog."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Having built from India for the world, I've seen firsthand how founders can create a profound global impact when their ambitious vision is combined with their entrepreneurial energy. I understand the unique advantages of bridging Silicon Valley's GTM expertise with India's engineering depth. "}, {"_type": "span", "marks": ["strong"], "text": "What excites me most about partnering with founders is the chance to be their ally in those crucial early decisions that shape the company's trajectory."}], "style": "blockquote"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "“Today, we stand at the cusp of a platform shift unlike anything we’ve seen before and Indian talent is at the forefront. The AI revolution presents an unprecedented opportunity to redefine entire industries, and the India-US ecosystem is uniquely poised to rise to this challenge. With its vibrant talent pool, entrepreneurial spirit, and a growing track record of building category-defining companies this ecosystem is ready to create generational businesses that will shape the future. I’m excited to help audacious founders leverage these tailwinds and succeed in their global ambitions."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "For me, the founder's journey is nothing short of a hero’s quest. It’s a path filled with exhilarating breakthroughs, sleepless nights, profound challenges, and moments of glory. For founders operating in the India-US corridor, this journey is even more demanding—navigating time zones, bridging cultures, constant jet lag and making sacrifices most can’t imagine. Having lived this journey myself, I know the grit it takes. I hope to bring empathy and genuine partnership to every founder interaction, helping them tackle the big and small battles along the way.”"}], "style": "normal"}]}, "cursorText": "What excites me most about partnering with founders is the chance to be their ally in those crucial early decisions that shape the company's trajectory.", "expertise": [{"_id": "76783816-50b8-4bd0-b0ad-08c495102405", "title": "Enterprise AI"}], "isAuthor": true, "page": {"parent": {"_type": "page", "parent": null, "slug": "team", "title": "Team"}, "slug": "krishna-mehra"}, "parent": null, "photo": null, "photoTwo": null, "position": "Partner", "slug": null, "socialLinks": [{"_type": "socialLink", "title": "LinkedIn", "url": "https://www.linkedin.com/in/kpowerinfinity/"}, {"_type": "socialLink", "title": "X", "url": "https://x.com/kpowerinfinity"}, {"_type": "socialLink", "title": "Blog", "url": "https://dayzero.substack.com/"}], "stage": ["growth", "venture"], "teamMemberType": {"_createdAt": "2024-04-08T23:04:22Z", "_id": "1c80ec0d-3d5f-44f6-8cfe-e2336c1a9495", "_type": "teamMemberType", "_updatedAt": "2024-04-08T23:04:22Z", "priority": 1, "slug": {"_type": "slug", "current": "investment-team"}, "title": "Investment Team"}, "title": "Krishna Mehra"}, {"_id": "e57d8d34-809f-498e-b0f0-9ff65232a4ff", "_type": "teamMember", "bio": {"text": [{"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Poorvi focuses on early stage investments across Enterprise AI and DevOps. Previously, she worked at Amazon in India and then in the UK, leading key strategic initiatives in Alexa AI, Seller Services and International Expansion. Poorvi graduated from Harvard Business School in 2021, and is an alumnus of Indian Institute of Technology, Guwahati. With a keen interest in design and product, she is constantly tinkering with new products and is always on the lookout for interesting ideas."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "I see founders as my customers - what they need, how can I help them, and the ways to make them successful is what motivates me to work hard in this job."}], "style": "blockquote"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "\"I like the science + art of venture investing. In early stage investing, we meet founders in their initial journey when they are still getting out of the weeds, dreaming big and betting the next few years of their lives on a bold idea. It’s a privilege to partner with these entrepreneurs in their journey full of passion, perseverance and grit."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Successful entrepreneurs know their product and customers better than anyone else and have a unique desire to succeed. My best partnerships with founders come from this shared sense of vulnerability, optimism and the willingness to break the rules and go that extra mile.\""}], "style": "normal"}]}, "cursorText": "I see founders as my customers - what they need, how can I help them, and the ways to make them successful is what motivates me to work hard in this job.", "expertise": [{"_id": "76783816-50b8-4bd0-b0ad-08c495102405", "title": "Enterprise AI"}], "isAuthor": true, "page": {"parent": {"_type": "page", "parent": null, "slug": "team", "title": "Team"}, "slug": "poorvi-vijay"}, "parent": null, "photo": null, "photoTwo": null, "position": "Principal", "slug": null, "socialLinks": [{"_type": "socialLink", "title": "LinkedIn", "url": "https://www.linkedin.com/in/poorvi-vijay-4503b042/"}, {"_type": "socialLink", "title": "Twitter", "url": "https://twitter.com/PoorviVijay"}], "stage": ["venture"], "teamMemberType": {"_createdAt": "2024-04-08T23:04:22Z", "_id": "1c80ec0d-3d5f-44f6-8cfe-e2336c1a9495", "_type": "teamMemberType", "_updatedAt": "2024-04-08T23:04:22Z", "priority": 1, "slug": {"_type": "slug", "current": "investment-team"}, "title": "Investment Team"}, "title": "Poorvi Vijay"}], "parent": {"_id": "1dd14766-8cdd-46e7-b7b2-82836149b4c4", "_type": "page", "parent": {"_type": "page", "parent": null, "slug": "perspectives", "title": "Perspectives"}, "slug": "portfolio-blog", "title": "Portfolio"}, "postCategory": {"_id": "a6a8c4fe-c74e-4e17-a285-fa50e1d1adf2", "_type": "postCategory", "icon": null, "pagePath": "/perspectives/portfolio-blog", "parent": null, "slug": "portfolio-blog", "title": "Portfolio Perspectives"}, "post_date": "2025-05-19T07:37:37.852Z", "preview_snippet": "Building the agent layer for every application.", "slices": [{"_type": "post_hero", "image": null, "layout": "image", "subtitle": "Building the agent layer for every application", "title": "Investing in Adopt AI"}], "slug": "investing-in-adopt-ai", "tag": [{"_id": "a4b76baf-d15f-4abc-bd1c-02de8f515019", "_type": "tag", "parent": null, "slug": "enterpriseai", "title": "Enterprise AI"}], "title": "Investing in Adopt AI"}}}}, "page": "/[[...slug]]", "query": {"slug": ["investing-in-adopt-ai"]}}</script></body></html>
