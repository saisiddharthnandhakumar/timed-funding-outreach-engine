<!DOCTYPE html><html><head><title>Investing in Vegapay - Elevation Capital</title></head><body><script id="__NEXT_DATA__" type="application/json">{"props": {"pageProps": {"data": {"page": {"_createdAt": "2024-08-12T12:36:24Z", "_id": "fef60e5f-5770-4b68-8347-2b981e015ab6", "_type": "post", "_updatedAt": "2025-05-30T10:41:28Z", "authors": [{"_id": "e71c4074-34be-419c-b46d-35d7a2ce929c", "_type": "teamMember", "bio": {"text": [{"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Mridul joined Elevation in 2011, focusing primarily on the fund's investments in Financial Services and Fintech. His portfolio includes Acko, Aye Finance, Mintifi, Dezerv, Clear, and Urban Company. Mridul is an alumnus of IIT-Madras and IIM-Lucknow."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "\"The greatest satisfaction I derive from my work is the privilege of engaging with sharp, driven founders and collaboratively solving their most pressing challenges. As investors, I believe our role is to serve the companies and founders we partner with, demonstrating deep commitment and full conviction. Supporting founders closely and witnessing their success is immensely gratifying."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Throughout this journey, my role adapts across our portfolio companies—guiding the formation of high-performing teams, collaborating on strategic decisions, or simply serving as a trusted advisor. The focus is on offering support without overstepping, easing the pressures of a founder’s journey without overwhelming, and ultimately stepping back to celebrate their successes as they take flight."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "With nearly two decades of experience in the financial services sector, I understand the complexities and nuances that founders face in this space. The founders we work with are shaping the future, often at great personal sacrifice and by overcoming significant challenges. It is an honor to partner with such resilient individuals, and their relentless pursuit of success inspires me to bring my best every day.\""}], "style": "normal"}]}, "cursorText": "As investors, I believe our role is to serve the companies and founders we partner with, demonstrating deep commitment and full conviction.", "expertise": [{"_id": "226d9e11-ac48-47f7-80a0-8ecf8c3c56b2", "title": "Fintech & Financial Services"}], "isAuthor": true, "page": {"parent": {"_type": "page", "parent": null, "slug": "team", "title": "Team"}, "slug": "mridul-arora"}, "parent": null, "photo": null, "photoTwo": null, "position": "Partner", "slug": null, "socialLinks": [{"_type": "socialLink", "title": "LinkedIn", "url": "https://www.linkedin.com/in/aroramridul/"}], "stage": ["growth", "venture"], "teamMemberType": {"_createdAt": "2024-04-08T23:04:22Z", "_id": "1c80ec0d-3d5f-44f6-8cfe-e2336c1a9495", "_type": "teamMemberType", "_updatedAt": "2024-04-08T23:04:22Z", "priority": 1, "slug": {"_type": "slug", "current": "investment-team"}, "title": "Investment Team"}, "title": "Mridul Arora"}, {"_id": "72e87a9a-257c-4f2e-bf38-185b9f271c79", "_type": "teamMember", "bio": {"text": [{"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Vaas is a Partner at Elevation and focuses on early-stage investments in Fintech and Financial Services."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "Before Elevation, Vaas worked with Bain & Co., advising consumer and financial technology businesses. He also spent time at Barclays Bank, building internal products and tools for the bank’s emerging markets business. Vaas completed his MBA from IIM Calcutta and is an Institute Gold Medal holder, and graduated with a degree in Computer Engineering from the National University of Singapore (NUS). His greatest joy comes from working closely with founders in building companies."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "High trust, and alignment on playing the long game are, I believe, the foundation of a successful investor-founder partnership"}], "style": "blockquote"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "\"We have just scratched the surface in terms of the penetration and impact that technology has created in financial services."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "I look for founders who demonstrate unceasing customer empathy. Shaping the future is tough. But there are a few who embark on that journey with unshakeable belief and persistence, and few places match the energy and possibilities in India today. I feel privileged to partner with these change-makers in India."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "I believe that the most successful founders stand out because of their unceasing customer empathy. The surest sign of this in an early-stage founder is their unique insight or perspective on the status quo - earned through having spent time on the problem statement, connecting unrelated dots, or by putting themselves into unique information flows."}], "style": "normal"}, {"_type": "block", "children": [{"_type": "span", "marks": [], "text": "I believe high trust and alignment in playing the long game are the foundation of a successful investor-founder partnership. My truest commitment to a founder comes from the little things: listening with a true intent to listen, asking the right questions, and adopting the role that will be most helpful to founders at any given time.\""}], "style": "normal"}, {"_type": "tags", "tags": ["Languages", "Geopolitics", "History", "Mindfulness", "Learning to be a great dad!"], "title": "Personal Interests"}]}, "cursorText": "High trust, and alignment on playing the long game are, I believe, the foundation of a successful investor-founder partnership", "expertise": [{"_id": "226d9e11-ac48-47f7-80a0-8ecf8c3c56b2", "title": "Fintech & Financial Services"}], "isAuthor": true, "page": {"parent": {"_type": "page", "parent": null, "slug": "team", "title": "Team"}, "slug": "vaas-bhaskar"}, "parent": null, "photo": null, "photoTwo": null, "position": "Partner", "slug": null, "socialLinks": [{"_type": "socialLink", "title": "LinkedIn", "url": "https://www.linkedin.com/in/vaasbhaskar/"}, {"_type": "socialLink", "title": "Twitter", "url": "https://twitter.com/vaasbhaskar"}], "stage": ["growth", "venture"], "teamMemberType": {"_createdAt": "2024-04-08T23:04:22Z", "_id": "1c80ec0d-3d5f-44f6-8cfe-e2336c1a9495", "_type": "teamMemberType", "_updatedAt": "2024-04-08T23:04:22Z", "priority": 1, "slug": {"_type": "slug", "current": "investment-team"}, "title": "Investment Team"}, "title": "Vaas Bhaskar"}], "parent": {"_id": "1dd14766-8cdd-46e7-b7b2-82836149b4c4", "_type": "page", "parent": {"_type": "page", "parent": null, "slug": "perspectives", "title": "Perspectives"}, "slug": "portfolio-blog", "title": "Portfolio"}, "postCategory": {"_id": "a6a8c4fe-c74e-4e17-a285-fa50e1d1adf2", "_type": "postCategory", "icon": null, "pagePath": "/perspectives/portfolio-blog", "parent": null, "slug": "portfolio-blog", "title": "Portfolio Perspectives"}, "postInitiative": {"_id": "2c59c731-c7ab-4009-a60e-e272850b4879", "_type": "postInitiative", "parent": null, "slug": "memos", "title": "Memos"}, "post_date": "2024-06-07T06:05:00.000Z", "preview_snippet": "New-age credit infra for BFSI", "slices": [{"_type": "post_hero", "image": null, "layout": "image", "subtitle": "New-age credit infra for BFSI", "title": "Investing in Vegapay"}], "slug": "investing-in-vegapay", "tag": [{"_id": "6021b14a-6d15-4d89-81c9-da49de204cb1", "_type": "tag", "parent": null, "slug": "fintech-sector", "title": "Fintech & Financial Services"}], "title": "Investing in Vegapay"}}}}, "page": "/[[...
